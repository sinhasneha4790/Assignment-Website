DC.define("Product", (function () {
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const cur = st.size || 'M';
const col = st.colour || 'Ecru';
const palette = [
{ name: 'Ecru', hex: '#EDE6D6', img: 'images/p-shirt-ecru.svg' }, { name: 'Sage', hex: '#9BA88C', img: 'images/p-shirt-sage.svg' },
{ name: 'Rust', hex: '#A0583A', img: 'images/p-shirt-rust.svg' }, { name: 'Navy', hex: '#2E3A4F', img: 'images/p-shirt-navy.svg' }
];
const colours = palette.map((c) => ({ name: c.name, hex: c.hex, ring: c.name === col ? '#26251F' : '#DDD5C7', pick: () => this.setState({ colour: c.name }) }));
const sel = palette.find((c) => c.name === col) || palette[0];
const sizes = ['XS', 'S', 'M', 'L', 'XL', '2XL', '3XL'].map((l) => {
const sold = l === '3XL';
return { label: l, cls: sold ? 'off' : (l === cur ? 'on' : ''), pressed: l === cur ? 'true' : 'false', pick: () => { if (!sold) this.setState({ size: l }); } };
});
return { colours, colourName: col, img: sel.img, sizes, sizeLabel: cur };
}
}
return Component;
})());
DC.mount("Product");
</script>
