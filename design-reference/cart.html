DC.define("Cart", (function () {
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const base = [
{ id: 'a', name: 'Linen Workday Shirt', meta: 'Ecru · Size M · Women · Professional', price: 2490, img: 'images/p-shirt-ecru.svg' },
{ id: 'b', name: 'Pleated Wide Trouser', meta: 'Olive · Size 30 · Women · Professional', price: 3290, img: 'images/p-trouser-olive.svg' }
];
const fmt = (n) => '₹' + n.toLocaleString('en-IN');
let sub = 0, count = 0;
const items = base.map((b) => {
const q = (st[b.id] == null ? 1 : st[b.id]);
sub += q * b.price; count += q;
return { name: b.name, meta: b.meta, img: b.img, qty: q, total: fmt(q * b.price),
inc: () => this.setState({ [b.id]: q + 1 }), dec: () => this.setState({ [b.id]: Math.max(1, q - 1) }) };
});
const free = 2999;
const left = Math.max(0, free - sub);
return {
items, count, subtotal: fmt(sub),
delivery: left === 0 ? 'Free' : fmt(99),
total: fmt(sub + (left === 0 ? 0 : 99)),
shipMsg: left === 0 ? 'You have free delivery.' : 'Add ' + fmt(left) + ' more for free delivery.',
shipPct: Math.min(100, Math.round(sub / free * 100)) + '%'
};
}
}
return Component;
})());
DC.mount("Cart");
