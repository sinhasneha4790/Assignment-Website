<div class="eyebrow" style="color:#D6DBCB">Personal styling</div>
<h1 class="serif" style="font-size:58px;line-height:1.04">Your wardrobe, sorted in an hour.</h1>
<p style="color:#E3E6D9;font-size:17px;max-width:460px">Meet a Folk &amp; Form stylist in store or on video. Tell us your week; leave with outfits that work for it — and no pressure to buy.</p>
<div style="display:flex;gap:12px;flex-wrap:wrap"><a href="booking.html" class="btn" style="background:#FBF8F3;color:#26251F;border-color:#FBF8F3">Book a session</a><a href="#services" class="btn btn-line" style="color:#FBF8F3;border-color:#FBF8F3">See services</a></div>
</div>
<div class="pic" style="flex:1 1 460px;height:420px"><img src="images/s-stylist.svg" alt="A stylist with a client beside a clothes rail"></div>
</div>
</section>

<section class="wrap" style="padding-top:64px;padding-bottom:64px">
<h2 class="serif" style="font-size:34px;margin-bottom:24px">How it works</h2>
<div class="grid3">
<div class="stack" style="gap:10px"><span class="serif" style="font-size:44px;color:#4F5D43">01</span><b>Pick a time</b><span class="muted">Choose a service, in store or video, and a stylist who suits you.</span></div>
<div class="stack" style="gap:10px"><span class="serif" style="font-size:44px;color:#4F5D43">02</span><b>Tell us about you</b><span class="muted">A 2-minute form: sizes, budget, colours, the occasions you dress for.</span></div>
<div class="stack" style="gap:10px"><span class="serif" style="font-size:44px;color:#4F5D43">03</span><b>Get your looks</b><span class="muted">After the session your picks land in your account, ready to buy.</span></div>
</div>
</section>

<section id="services" class="wrap" style="padding-bottom:64px">
<h2 class="serif" style="font-size:34px;margin-bottom:24px">Services</h2>
<div class="grid3">
<sc-for list="{{services}}" as="s" hint-placeholder-count="6">
<div class="card" style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;gap:8px"><span class="pill {{s.pillCls}}">{{s.format}}</span><span class="small muted">{{s.length}}</span></div>
<h3 class="serif" style="font-size:22px">{{s.name}}</h3>
<p class="small muted">{{s.desc}}</p>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px"><span class="price">{{s.price}}</span><a href="booking.html" class="btn" style="min-height:44px;padding:0 18px">Book</a></div>
</div>
</sc-for>
</div>
</section>

<section class="wrap" style="padding-bottom:64px">
<h2 class="serif" style="font-size:34px;margin-bottom:24px">Meet the stylists</h2>
<div class="grid3">
<div class="stack" style="gap:10px"><div class="pic" style="height:280px"><img src="images/s-woman-work.svg" alt="Meera Kalita"></div><b>Meera Kalita</b><span class="small muted">Workwear &amp; capsule wardrobes · English, Hindi, Assamese</span><span class="small">★ 4.9 · 312 sessions</span></div>
<div class="stack" style="gap:10px"><div class="pic" style="height:280px"><img src="images/s-man-suit.svg" alt="Arjun Bora"></div><b>Arjun Bora</b><span class="small muted">Menswear &amp; tailoring · English, Assamese</span><span class="small">★ 4.8 · 204 sessions</span></div>
<div class="stack" style="gap:10px"><div class="pic" style="height:280px"><img src="images/s-woman-dress.svg" alt="Riya Das"></div><b>Riya Das</b><span class="small muted">Festive, ethnic &amp; teen streetwear · English, Bengali</span><span class="small">★ 4.9 · 186 sessions</span></div>
</div>
</section>

<section class="wrap" style="padding-bottom:72px;display:flex;flex-wrap:wrap;gap:48px">
<div style="flex:1 1 300px"><h2 class="serif" style="font-size:34px">Questions</h2><p class="muted" style="margin-top:8px">Full details in our <a href="help.html" style="text-decoration:underline;color:#5C584E">booking &amp; cancellation policy</a>.</p></div>
<div style="flex:2 1 520px">
<details open=""><summary>Do I have to buy anything?</summary><p class="muted" style="margin-top:8px">No. Paid sessions come with credit you can spend on clothes within 30 days.</p></details>
<details><summary>Can I book for my partner or teen?</summary><p class="muted" style="margin-top:8px">Yes — choose who it’s for when booking. Under-18s attend with a parent or guardian.</p></details>
<details><summary>What if I need to reschedule?</summary><p class="muted" style="margin-top:8px">Reschedule or cancel free up to 24 hours before from your confirmation email.</p></details>
<details><summary>What do I need for a video session?</summary><p class="muted" style="margin-top:8px">A phone or laptop, good light, and a few pieces you already own nearby.</p></details>
</div>
</section>
