<template id="tpl-Admin">

<div class="serif" style="font-size:22px;color:#FBF8F3;padding:0 10px 18px">Folk &amp; Form <span style="font-family:'Manrope';font-size:11px;letter-spacing:.1em;color:#A8A296">ADMIN</span></div>
<sc-for list="{{nav}}" as="n" hint-placeholder-count="11"><button onClick="{{n.pick}}" style="text-align:left;min-height:42px;padding:0 12px;border:0;border-radius:2px;background:{{n.bg}};color:{{n.fg}};font:500 14px 'Manrope',sans-serif;cursor:pointer">{{n.name}}</button></sc-for>
<div style="margin-top:auto;padding:16px 10px 0;font-size:12px;color:#A8A296">Signed in as Owner · 2-step on</div>
</nav>

</table>
</div>

<div class="grid2" style="gap:16px">

<div style="display:flex;justify-content:space-between" class="small"><span>11:00 · Work capsule · Priya S.</span><span class="pill">Meera</span></div>

<a href="admin.html" class="small" style="text-decoration:underline">Restock in Inventory</a>

</div>
</main>
