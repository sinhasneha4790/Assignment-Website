</sc-for>

<div class="field" style="margin:0"><label for="bu">Bust / chest (cm)</label><input id="bu" value="92"></div>
<div class="field" style="margin:0"><label for="wa">Waist (cm)</label><input id="wa" value="76"></div>
</div>
