<p class="muted" style="font-size:17px">Folk &amp; Form started in Guwahati in 2026 with a simple idea: the shirt you wear to a board meeting should also work at a Sunday market. We design quiet, well-cut pieces for teens, women and men — in breathable fabrics, honest sizes and colours borrowed from tea gardens and river light.</p>
