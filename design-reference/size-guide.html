<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Size guide — Folk &amp; Form</title>
<link rel="stylesheet" href="assets/ff.css">
<link rel="stylesheet" href="assets/responsive.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">Please turn on JavaScript to view this page.</p></noscript>
<template id="tpl-SizeGuide">
<div style="width:100%;min-height:1000px;background:#8E897E;display:flex;justify-content:flex-end;flex-wrap:wrap">
<div aria-hidden="true" style="flex:1 1 300px;padding:40px;color:#F5F0E8;font-size:13px">Product page, dimmed behind the panel</div>
<aside role="dialog" aria-label="Size guide" style="flex:0 1 600px;max-width:100%;background:#FBF8F3;padding:32px;display:flex;flex-direction:column;gap:22px">
<div style="display:flex;justify-content:space-between;align-items:center">
<h1 class="serif" style="font-size:32px">Size guide</h1>
<a href="product.html" aria-label="Close size guide" style="width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:22px">✕</a>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip on">Women</span><span class="chip">Men</span><span class="chip">Teens</span><span class="chip">Size conversion</span></div>
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
<span style="font-weight:700">Tops &amp; shirts — body measurements</span>
<div role="group" aria-label="Units" style="display:flex;gap:6px"><button class="chip {{cmCls}}" onClick="{{toCm}}">cm</button><button class="chip {{inCls}}" onClick="{{toIn}}">inches</button></div>
</div>
<div style="overflow-x:auto">
<table class="tbl">
<thead><tr><th>Size</th><th>Bust ({{unit}})</th><th>Waist ({{unit}})</th><th>Hip ({{unit}})</th><th>UK / US</th></tr></thead>
<tbody>
<tr dc-for="{{rows}}" dc-as="r" style="background:{{r.bg}}"><td style="font-weight:700">{{r.size}}</td><td>{{r.bust}}</td><td>{{r.waist}}</td><td>{{r.hip}}</td><td>{{r.intl}}</td></tr>
</tbody>
</table>
</div>
<div class="small muted">Sample values — replace with your pattern-maker’s measurements. Your saved size (M) is highlighted.</div>
<div class="card" style="display:flex;gap:18px;align-items:center;padding:18px">
<div class="ph stone" style="width:96px;height:120px;flex:none;justify-content:center;align-items:center;text-align:center">How to measure</div>
<ol class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
<li><b>Bust:</b> around the fullest part, tape level.</li>
<li><b>Waist:</b> around the narrowest part of your torso.</li>
<li><b>Hip:</b> around the fullest part, feet together.</li>
</ol>
</div>
<div class="grid2" style="gap:12px">
<div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:6px">This product</div><div class="small">Regular fit · true to size. Model is 5′6″ and wears M.</div></div>
<div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:6px">Between sizes?</div><div class="small">Size up for a relaxed look, down for a closer fit.</div></div>
</div>
<div style="display:flex;gap:10px;flex-wrap:wrap"><a href="help.html" class="btn btn-line">Chat with us</a><a href="booking.html" class="btn">Book a free fitting</a></div>
</aside>
</div>
</template>
<script src="assets/dc-runtime.js"></script>
<script>
window.DC_IMAGES = {"0a5a91c1978472a6a63392ef61d9e03d":"images/p-belt.svg","5f06fcb7b57a96cc9bf01c913a4bd3b0":"images/p-blazer-dark.svg","8548b627c2ede5716356e827cba4afb1":"images/p-blazer.svg","405eb3754825ef2065cb32d5eb3a2f0e":"images/p-blouse.svg","75ba8083572feb6c570a44c02408a536":"images/p-chino.svg","a09dff6fec776cbc65d017f2a2385355":"images/p-dress-shirt.svg","ca4e6c2b802d7c0d7400d2687d131b5a":"images/p-dress-tier.svg","bb2676bb82953c9b4ac9a480e942c2ef":"images/p-jeans.svg","7986fa0adc8356b1c35165207f01c2ed":"images/p-knit-oat.svg","fdc30acd247fb4616541596f28c27baf":"images/p-knit.svg","43a0dd193ffd4b438a8c113904142014":"images/p-loafer.svg","bc17760d122de30f31cea51732f0afb6":"images/p-overshirt-olive.svg","b7609bd6df1b7f220c37a983f41e1126":"images/p-overshirt.svg","08998cb4fc648039b515a3bb1cc2145a":"images/p-polo.svg","5c506d5ea511b727eec0a2e398831ef5":"images/p-scarf.svg","6753dadb7329ed49e396cfe21cfeecba":"images/p-shirt-ecru.svg","429eba4fce063b85e288bbceced236be":"images/p-shirt-navy.svg","2ae98cfc8e93c851770c8b3ad866392b":"images/p-shirt-rust.svg","a1b02ce1d53a103daf64a90197a767a4":"images/p-shirt-sage.svg","9a7531df94019645931f9e11a808d1b4":"images/p-shirt-stripe.svg","ba3677ff81245a3842f43c2821694e6f":"images/p-tee-white.svg","d69e07880dd9291596554e9cddb3931b":"images/p-tee.svg","c6fda341961213f729b78fe72922ad0c":"images/p-tote.svg","864029471cec5d35eaab4fb37e50b988":"images/p-trouser-olive.svg","9f2fba091b57283d303e0e3e3ab0b152":"images/p-trouser-stone.svg","f037a18b30f07369202c33bbd24e4cf1":"images/s-duo.svg","9cd5cf73faefde3e5283459685b8591b":"images/s-man-cafe.svg","3a8c2dd9822ace0d05cc5240a05cf613":"images/s-man-suit.svg","c530f8ade21e65f27d2c4b054eb20b2c":"images/s-stylist.svg","1abe807593ab673c0df3304fbcf6a7c9":"images/s-teen.svg","b68ce9ef353b8386d2abcde0e995202f":"images/s-trio.svg","f6c03ffc8b9ff813299635c13fac3b6a":"images/s-woman-dress.svg","138c22cbc284c611bea5f5782b2426ca":"images/s-woman-weekend.svg","c6fe75be85eec019bee7f4251405fcb4":"images/s-woman-work.svg"};
DC.define("SizeGuide", (function () {
class Component extends DCLogic {
renderVals() {
const inch = (this.state && this.state.unit) === 'in';
const data = [['XS', 82, 66, 90, '6 / 2'], ['S', 86, 70, 94, '8 / 4'], ['M', 92, 76, 100, '10 / 6'], ['L', 98, 82, 106, '12 / 8'], ['XL', 104, 88, 112, '14 / 10'], ['2XL', 110, 94, 118, '16 / 12'], ['3XL', 116, 100, 124, '18 / 14']];
const f = (v) => inch ? (v / 2.54).toFixed(1) : String(v);
const rows = data.map((d) => ({ size: d[0], bust: f(d[1]), waist: f(d[2]), hip: f(d[3]), intl: d[4], bg: d[0] === 'M' ? '#E3E6D9' : 'transparent' }));
return {
rows, unit: inch ? 'in' : 'cm',
cmCls: inch ? '' : 'on', inCls: inch ? 'on' : '',
toCm: () => this.setState({ unit: 'cm' }), toIn: () => this.setState({ unit: 'in' })
};
}
}
return Component;
})());
DC.mount("SizeGuide");
</script>
</body>
</html>
