<template id="tpl-Login">
<div style="width:100%;background:#F5F0E8">
<div style="position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(38,37,31,.08)"><dc-import name="Header" hint-size="100%,112px"></dc-import></div>
<section class="wrap" style="padding-top:48px;padding-bottom:72px;display:flex;flex-direction:column;gap:28px">
<div><h1 class="serif" style="font-size:44px">Welcome to Folk &amp; Form</h1><p class="muted">Log in to track orders, save sizes and manage styling bookings. Shopping as a guest works too.</p></div>
<div class="grid3" style="align-items:start">

<div class="card" style="display:flex;flex-direction:column;gap:14px">
<div class="eyebrow">1 · Log in</div>
<div role="tablist" aria-label="Log in with" style="display:flex;gap:6px"><button role="tab" aria-selected="{{phoneSel}}" class="chip {{phoneCls}}" onClick="{{usePhone}}">Mobile</button><button role="tab" aria-selected="{{emailSel}}" class="chip {{emailCls}}" onClick="{{useEmail}}">Email</button></div>
<sc-if value="{{isPhone}}" hint-placeholder-val="{{ true }}">
<div class="field" style="margin:0"><label for="lp">Mobile number</label><input id="lp" type="tel" value="+91 "></div>
<a href="login.html#otp" class="btn">Send me a code</a>
</sc-if>
<sc-if value="{{isEmail}}" hint-placeholder-val="{{ false }}">
<div class="field" style="margin:0"><label for="le">Email</label><input id="le" type="email"></div>
<div class="field" style="margin:0"><label for="lpw">Password</label><input id="lpw" type="password"></div>
<a href="#forgot" class="small" style="text-decoration:underline;align-self:flex-end">Forgot password?</a>
<a href="account.html" class="btn">Log in</a>
</sc-if>
<div style="display:flex;align-items:center;gap:10px" class="small muted"><hr class="rule" style="flex:1">or<hr class="rule" style="flex:1"></div>
<button class="btn btn-line">Continue with Google</button>
<button class="btn btn-line">Continue with Apple</button>
<a href="checkout.html" class="small" style="text-align:center;text-decoration:underline">Continue as guest</a>
</div>

<div class="card" style="display:flex;flex-direction:column;gap:14px">
<div class="eyebrow">2 · Create account</div>
<div class="field" style="margin:0"><label for="sn">Full name</label><input id="sn"></div>
<div class="field" style="margin:0"><label for="sm">Mobile number</label><input id="sm" type="tel" value="+91 "></div>
<div class="field" style="margin:0"><label for="se">Email</label><input id="se" type="email"></div>
<div class="field" style="margin:0"><label for="sp">Password</label><input id="sp" type="password"><div style="display:flex;gap:4px;margin-top:8px"><span style="flex:1;height:4px;background:#4F5D43"></span><span style="flex:1;height:4px;background:#4F5D43"></span><span style="flex:1;height:4px;background:#DDD5C7"></span></div><div class="small muted" style="margin-top:4px">Good — add a symbol to make it strong</div></div>
<div class="field" style="margin:0"><label for="sb">Birthday <span class="muted" style="font-weight:400">(optional — for a birthday treat)</span></label><input id="sb" placeholder="DD / MM"></div>
<label class="check"><input type="checkbox" checked=""> Send me new drops and style notes</label>
<label class="check"><input type="checkbox"> I agree to the <a href="help.html" style="text-decoration:underline;margin-left:4px">Terms</a>&nbsp;and&nbsp;<a href="help.html" style="text-decoration:underline">Privacy policy</a></label>
<a href="login.html#otp" class="btn">Create account</a>
</div>

<div style="display:flex;flex-direction:column;gap:24px">
<div id="otp" class="card" style="display:flex;flex-direction:column;gap:14px">
<div class="eyebrow">3 · Verify your number</div>
<p class="small">Enter the 6-digit code sent to <b>+91 98XXX XX210</b>. <a href="login.html" style="text-decoration:underline">Change</a></p>
<div role="group" aria-label="One-time code" style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px">
<input aria-label="Digit 1" value="4" style="text-align:center;font-size:20px;padding:0"><input aria-label="Digit 2" value="8" style="text-align:center;font-size:20px;padding:0"><input aria-label="Digit 3" value="2" style="text-align:center;font-size:20px;padding:0"><input aria-label="Digit 4" style="text-align:center;font-size:20px;padding:0"><input aria-label="Digit 5" style="text-align:center;font-size:20px;padding:0"><input aria-label="Digit 6" style="text-align:center;font-size:20px;padding:0">
</div>
<div class="small muted">Resend code in 0:24</div>
<a href="account.html" class="btn">Verify &amp; continue</a>
</div>
<div id="forgot" class="card" style="display:flex;flex-direction:column;gap:14px">
<div class="eyebrow">4 · Reset password</div>
<div class="field" style="margin:0"><label for="fe">Email or mobile</label><input id="fe"></div>
<button class="btn btn-line">Send reset link</button>
<div class="small muted">Then: new password + confirm, with a strength meter.</div>
</div>
</div>

</div>
